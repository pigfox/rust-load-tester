[package]
name = "endpoint_tester"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "time"] }
# reqwest's default features include default-tls, which pulls native-tls and
# then openssl. This crate already asks for rustls-tls, so that second TLS stack
# was compiled in and never used — and it carried eight security advisories.
# Turning defaults off deletes the openssl subtree outright instead of chasing
# its version.
#
# The other three defaults are RE-ADDED EXPLICITLY rather than dropped along with
# it. default-features = false on its own would also remove http2, and this is an
# HTTP load tester: it would have gone on measuring happily while silently
# negotiating HTTP/1.1 against every HTTP/2 server, which is a change in what the
# numbers mean rather than a change in what is compiled. charset and system-proxy
# are kept for the same reason — the intent here is to remove one TLS stack, not
# to quietly narrow the tool.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2", "system-proxy"] }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
hdrhistogram = "7.5"
anyhow = "1.0"
url = "2.5"

[dev-dependencies]
tempfile = "3.10"
hyper = { version = "1.8", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
